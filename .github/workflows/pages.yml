name: Publish WebGL
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: growing-city-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node Tools/package-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: growing-city-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
        with:
          artifact_name: growing-city-${{ github.run_id }}-${{ github.run_attempt }}
